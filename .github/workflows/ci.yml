name: Backend CI

on:
  pull_request:
    branches:
      - main
      - develop
  push:
    branches:
      - main
      - develop

permissions:
  contents: read

concurrency:
  group: backend-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: kuquest
          POSTGRES_PASSWORD: kuquest-ci-only
          POSTGRES_USER: kuquest
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U kuquest -d kuquest"
          --health-interval 2s
          --health-timeout 5s
          --health-retries 15
      rustfs:
        image: rustfs/rustfs:latest
        env:
          RUSTFS_ACCESS_KEY: ci-only-access-key
          RUSTFS_SECRET_KEY: ci-only-secret-key
          RUSTFS_CONSOLE_ENABLE: 'false'
        ports:
          - 9000:9000
        options: >-
          --health-cmd "curl --fail http://localhost:9000/health || exit 1"
          --health-interval 2s
          --health-timeout 5s
          --health-retries 15

    env:
      DATABASE_URL: postgresql://kuquest:kuquest-ci-only@localhost:5432/kuquest
      S3_ENDPOINT: http://127.0.0.1:9000
      S3_REGION: us-east-1
      S3_BUCKET: ci-only
      S3_ACCESS_KEY_ID: ci-only-access-key
      S3_SECRET_ACCESS_KEY: ci-only-secret-key

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Validate GitHub Actions workflows
        run: |
          docker run \
            --rm \
            --volume "$PWD:/repo" \
            --workdir /repo \
            rhysd/actionlint:1.7.7

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: .bun-version

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Create CI S3 bucket
        run: |
          docker run \
            --rm \
            --network host \
            --env AWS_ACCESS_KEY_ID="$S3_ACCESS_KEY_ID" \
            --env AWS_SECRET_ACCESS_KEY="$S3_SECRET_ACCESS_KEY" \
            amazon/aws-cli:latest \
            s3 mb "s3://$S3_BUCKET" \
            --endpoint-url "$S3_ENDPOINT" \
            --region "$S3_REGION"

      - name: Resolve migration comparison base
        shell: bash
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          BEFORE_SHA: ${{ github.event.before }}
          EVENT_NAME: ${{ github.event_name }}
        run: |
          set -euo pipefail

          if [ "$EVENT_NAME" = "pull_request" ]; then
            MIGRATION_BASE="$BASE_SHA"
          else
            MIGRATION_BASE="$BEFORE_SHA"
          fi

          if [[ -z "$MIGRATION_BASE" || "$MIGRATION_BASE" =~ ^0+$ ]]; then
            MIGRATION_BASE=$(git rev-parse HEAD^)
          fi

          git cat-file -e "$MIGRATION_BASE^{commit}"
          printf 'MIGRATION_BASE_REF=%s\n' "$MIGRATION_BASE" >> "$GITHUB_ENV"

      # CI test data does not need to survive a crash, so the tests do not wait for disk writes.
      - name: Remove PostgreSQL durability waits
        env:
          POSTGRES_CONTAINER: ${{ job.services.postgres.id }}
        run: |
          docker exec "$POSTGRES_CONTAINER" psql --username kuquest --dbname kuquest \
            --command 'ALTER SYSTEM SET fsync = off' \
            --command 'ALTER SYSTEM SET synchronous_commit = off' \
            --command 'ALTER SYSTEM SET full_page_writes = off' \
            --command 'SELECT pg_reload_conf()'

      - name: Run validation
        shell: bash
        run: |
          set -uo pipefail

          bun run db:check || exit 1

          names=()
          pids=()
          start() {
            local name=$1
            shift
            "$@" >"$RUNNER_TEMP/$name.log" 2>&1 &
            names+=("$name")
            pids+=("$!")
          }

          run_tests() {
            cd "$1" && xargs -a "$2" bun test
          }

          start lint bun run lint
          start format bun run format:check
          start typecheck bun run typecheck

          # tests/preload.ts names the test database after the current folder, and it keeps the
          # pristine migration database below untouched. Each group gets its own folder, so each
          # group gets its own database. Largest files first gives groups of a similar size.
          groups=3
          find . \( -path ./node_modules -o -path ./.git \) -prune -o -type f \
            -regextype posix-extended -regex '.*[._](test|spec)\.(ts|tsx|js|jsx)' -printf '%s %p\n' |
            sort -k1,1rn -k2 |
            cut -d' ' -f2- >"$RUNNER_TEMP/test-files"
          for group in $(seq 1 "$groups"); do
            folder="$RUNNER_TEMP/tests_$group"
            mkdir "$folder"
            cp -al . "$folder/"
            awk -v groups="$groups" -v group="$group" 'NR % groups == group % groups' \
              "$RUNNER_TEMP/test-files" >"$RUNNER_TEMP/test-files-$group"
            start "test-$group" run_tests "$folder" "$RUNNER_TEMP/test-files-$group"
          done

          status=0
          for index in "${!pids[@]}"; do
            name=${names[$index]}
            result=passed
            if ! wait "${pids[$index]}"; then
              result=FAILED
              status=1
            fi
            echo "::group::$name $result"
            cat "$RUNNER_TEMP/$name.log"
            echo '::endgroup::'
            if [ "$result" = FAILED ]; then
              echo "::error::$name failed"
            fi
          done
          [ "$status" -eq 0 ] || exit "$status"

          bun run build

      - name: Build production image
        run: docker build --tag kuquest-api:ci .

      - name: Apply complete migration chain from production image
        run: |
          docker run \
            --rm \
            --network host \
            --env DATABASE_URL \
            kuquest-api:ci \
            bun run db:migrate

      - name: Verify migration repeat execution
        run: |
          docker run \
            --rm \
            --network host \
            --env DATABASE_URL \
            kuquest-api:ci \
            bun run db:migrate

      - name: Verify production image health
        shell: bash
        run: |
          set -euo pipefail

          docker run \
            --detach \
            --rm \
            --name kuquest-api-ci \
            --network host \
            --env DATABASE_URL \
            --env BETTER_AUTH_URL=http://localhost:5000 \
            --env BETTER_AUTH_SECRET=ci-only-secret-at-least-32-characters \
            --env ADMIN_BETTER_AUTH_SECRET=ci-only-admin-secret-at-least-32-characters \
            --env GOOGLE_CLIENT_ID=ci-only-client-id \
            --env GOOGLE_CLIENT_SECRET=ci-only-client-secret \
            --env S3_ENDPOINT \
            --env S3_REGION \
            --env S3_BUCKET \
            --env S3_ACCESS_KEY_ID \
            --env S3_SECRET_ACCESS_KEY \
            --env TERMS_URL=https://example.com/terms \
            --env PRIVACY_URL=https://example.com/privacy \
            --env DATA_USAGE_URL=https://example.com/data-usage \
            --env CONTACT_US_URL=https://example.com/contact-us \
            kuquest-api:ci

          for ATTEMPT in $(seq 1 30); do
            if curl --fail --silent http://localhost:5000/health >/dev/null; then
              exit 0
            fi

            if [ "$ATTEMPT" -eq 30 ]; then
              docker logs kuquest-api-ci
              exit 1
            fi

            sleep 1
          done

      - name: Verify browser test page
        run: curl --fail --silent http://localhost:5000/ | grep --fixed-strings '<title>KUQuest API Test Bench</title>'

      - name: Clean production image smoke-test container
        if: always()
        run: docker stop kuquest-api-ci 2>/dev/null || true
