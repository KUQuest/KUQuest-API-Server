name: Backend Staging CD

on:
  workflow_run:
    workflows:
      - Backend CI
    types:
      - completed
    branches:
      - develop

concurrency:
  group: backend-staging
  cancel-in-progress: false

permissions: {}

env:
  IMAGE_NAME: ghcr.io/kuquest/kuquest-api-server
  STAGING_SERVER: 192.168.1.210

jobs:
  build:
    name: Build staging image

    if: >
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.head_branch == 'develop'

    runs-on: ubuntu-latest

    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout validated commit
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push staging image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ env.IMAGE_NAME }}:${{ github.event.workflow_run.head_sha }}
            ${{ env.IMAGE_NAME }}:staging
          cache-from: type=gha,scope=api
          cache-to: type=gha,mode=max,scope=api

      - name: Publish PostgreSQL client image
        uses: docker/build-push-action@v6
        with:
          context: .
          target: postgres-client
          push: true
          tags: ${{ env.IMAGE_NAME }}:postgres-client-${{ github.event.workflow_run.head_sha }}
          cache-from: type=gha,scope=postgres-client
          cache-to: type=gha,mode=max,scope=postgres-client

  deploy:
    name: Deploy staging API

    needs:
      - build

    runs-on:
      - self-hosted
      - linux
      - deploy-staging

    environment: staging

    permissions:
      contents: read
      packages: read

    steps:
      - name: Checkout validated commit
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}

      - name: Prepare SSH credentials
        shell: bash
        env:
          SSH_PRIVATE_KEY: ${{ secrets.STAGING_SSH_KEY }}
          SSH_KNOWN_HOSTS: ${{ secrets.STAGING_KNOWN_HOSTS }}
        run: |
          set -euo pipefail

          if [ -z "$SSH_PRIVATE_KEY" ]; then
            echo "Missing GitHub secret: STAGING_SSH_KEY"
            exit 1
          fi

          if [ -z "$SSH_KNOWN_HOSTS" ]; then
            echo "Missing GitHub secret: STAGING_KNOWN_HOSTS"
            exit 1
          fi

          KEY_FILE="$RUNNER_TEMP/staging_key"
          HOSTS_FILE="$RUNNER_TEMP/staging_known_hosts"

          printf '%s\n' "$SSH_PRIVATE_KEY" > "$KEY_FILE"
          printf '%s\n' "$SSH_KNOWN_HOSTS" > "$HOSTS_FILE"

          chmod 600 "$KEY_FILE"
          chmod 600 "$HOSTS_FILE"

      - name: Test SSH connection
        shell: bash
        run: |
          set -euo pipefail

          ssh \
            -i "$RUNNER_TEMP/staging_key" \
            -o BatchMode=yes \
            -o StrictHostKeyChecking=yes \
            -o UserKnownHostsFile="$RUNNER_TEMP/staging_known_hosts" \
            deploy@"$STAGING_SERVER" \
            'echo "SSH connection successful"'

      - name: Create application environment file
        shell: bash
        env:
          POSTGRES_PASSWORD: ${{ secrets.POSTGRES_PASSWORD }}
          DATABASE_URL: ${{ secrets.DATABASE_URL }}

          BETTER_AUTH_URL: ${{ secrets.BETTER_AUTH_URL }}
          BETTER_AUTH_SECRET: ${{ secrets.BETTER_AUTH_SECRET }}
          ADMIN_BETTER_AUTH_SECRET: ${{ secrets.ADMIN_BETTER_AUTH_SECRET }}
          STAGING_ADMIN_SEED_ENABLED: ${{ secrets.STAGING_ADMIN_SEED_ENABLED }}
          ADMIN_EMAIL: ${{ secrets.ADMIN_EMAIL }}
          ADMIN_PASSWORD: ${{ secrets.ADMIN_PASSWORD }}
          ADMIN_FIRST_NAME: ${{ secrets.ADMIN_FIRST_NAME }}
          ADMIN_LAST_NAME: ${{ secrets.ADMIN_LAST_NAME }}
          STAGING_TEST_AUTH_ENABLED: ${{ secrets.STAGING_TEST_AUTH_ENABLED }}
          STAGING_TEST_AUTH_EMAIL: ${{ secrets.STAGING_TEST_AUTH_EMAIL }}
          STAGING_TEST_AUTH_PASSWORD: ${{ secrets.STAGING_TEST_AUTH_PASSWORD }}
          STAGING_TEST_AUTH_FIRST_NAME: ${{ secrets.STAGING_TEST_AUTH_FIRST_NAME }}
          STAGING_TEST_AUTH_LAST_NAME: ${{ secrets.STAGING_TEST_AUTH_LAST_NAME }}
          GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
          GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}

          S3_ENDPOINT: ${{ secrets.S3_ENDPOINT }}
          S3_REGION: ${{ secrets.S3_REGION }}
          S3_BUCKET: ${{ secrets.S3_BUCKET }}
          S3_ACCESS_KEY_ID: ${{ secrets.S3_ACCESS_KEY_ID }}
          S3_SECRET_ACCESS_KEY: ${{ secrets.S3_SECRET_ACCESS_KEY }}

          XENDIT_SECRET_KEY: ${{ secrets.XENDIT_SECRET_KEY }}
          XENDIT_WEBHOOK_TOKEN: ${{ secrets.XENDIT_WEBHOOK_TOKEN }}

          PAYOUT_DESTINATION_ENCRYPTION_KEY: ${{ secrets.PAYOUT_DESTINATION_ENCRYPTION_KEY }}
          PAYOUT_DESTINATION_ENCRYPTION_KEY_VERSION: ${{ secrets.PAYOUT_DESTINATION_ENCRYPTION_KEY_VERSION }}
          PAYMENT_PROVIDER_EVENT_ENCRYPTION_KEY: ${{ secrets.PAYMENT_PROVIDER_EVENT_ENCRYPTION_KEY }}
          PAYMENT_PROVIDER_EVENT_ENCRYPTION_KEY_VERSION: ${{ secrets.PAYMENT_PROVIDER_EVENT_ENCRYPTION_KEY_VERSION }}

          CMS_ORIGIN: ${{ secrets.CMS_ORIGIN }}

          TERMS_URL: ${{ secrets.TERMS_URL }}
          PRIVACY_URL: ${{ secrets.PRIVACY_URL }}
          DATA_USAGE_URL: ${{ secrets.DATA_USAGE_URL }}
          CONTACT_US_URL: ${{ secrets.CONTACT_US_URL }}
        run: |
          set -euo pipefail

          REQUIRED_SECRETS=(
            POSTGRES_PASSWORD
            DATABASE_URL
            BETTER_AUTH_URL
            BETTER_AUTH_SECRET
            ADMIN_BETTER_AUTH_SECRET
            GOOGLE_CLIENT_ID
            GOOGLE_CLIENT_SECRET
            S3_ENDPOINT
            S3_REGION
            S3_BUCKET
            S3_ACCESS_KEY_ID
            S3_SECRET_ACCESS_KEY
            XENDIT_SECRET_KEY
            XENDIT_WEBHOOK_TOKEN
            PAYOUT_DESTINATION_ENCRYPTION_KEY
            PAYMENT_PROVIDER_EVENT_ENCRYPTION_KEY
            CMS_ORIGIN
            TERMS_URL
            PRIVACY_URL
            DATA_USAGE_URL
            CONTACT_US_URL
          )

          for SECRET_NAME in "${REQUIRED_SECRETS[@]}"; do
            if [ -z "${!SECRET_NAME}" ]; then
              echo "Missing GitHub secret: $SECRET_NAME"
              exit 1
            fi
          done

          if [ "${STAGING_ADMIN_SEED_ENABLED:-false}" = 'true' ]; then
            ADMIN_SEED_SECRETS=(
              ADMIN_EMAIL
              ADMIN_PASSWORD
              ADMIN_FIRST_NAME
              ADMIN_LAST_NAME
            )

            for SECRET_NAME in "${ADMIN_SEED_SECRETS[@]}"; do
              if [ -z "${!SECRET_NAME}" ]; then
                echo "Missing GitHub secret: $SECRET_NAME"
                exit 1
              fi
            done
          fi

          if [ "${STAGING_TEST_AUTH_ENABLED:-false}" = 'true' ]; then
            TEST_AUTH_SECRETS=(
              STAGING_TEST_AUTH_EMAIL
              STAGING_TEST_AUTH_PASSWORD
              STAGING_TEST_AUTH_FIRST_NAME
              STAGING_TEST_AUTH_LAST_NAME
            )

            for SECRET_NAME in "${TEST_AUTH_SECRETS[@]}"; do
              if [ -z "${!SECRET_NAME}" ]; then
                echo "Missing GitHub secret: $SECRET_NAME"
                exit 1
              fi
            done
          fi

          ENV_FILE="$RUNNER_TEMP/backend.env"
          ADMIN_SEED_ENV_FILE="$RUNNER_TEMP/admin-seed.env"
          umask 077

          {
            printf 'NODE_ENV=production\n'
            printf 'DEPLOYMENT_ENV=staging\n'
            printf 'HOST=0.0.0.0\n'
            printf 'PORT=5000\n'

            printf 'POSTGRES_DB=kuquest\n'
            printf 'POSTGRES_USER=kuquest\n'
            printf 'POSTGRES_PASSWORD=%s\n' "$POSTGRES_PASSWORD"
            printf 'POSTGRES_PORT=5432\n'
            printf 'DATABASE_URL=%s\n' "$DATABASE_URL"

            printf 'BETTER_AUTH_URL=%s\n' "$BETTER_AUTH_URL"
            printf 'BETTER_AUTH_SECRET=%s\n' "$BETTER_AUTH_SECRET"
            printf 'ADMIN_BETTER_AUTH_SECRET=%s\n' "$ADMIN_BETTER_AUTH_SECRET"
            printf 'STAGING_TEST_AUTH_ENABLED=%s\n' "${STAGING_TEST_AUTH_ENABLED:-false}"
            if [ "${STAGING_TEST_AUTH_ENABLED:-false}" = 'true' ]; then
              printf 'STAGING_TEST_AUTH_EMAIL=%s\n' "$STAGING_TEST_AUTH_EMAIL"
              printf 'STAGING_TEST_AUTH_PASSWORD=%s\n' "$STAGING_TEST_AUTH_PASSWORD"
              printf 'STAGING_TEST_AUTH_FIRST_NAME=%s\n' "$STAGING_TEST_AUTH_FIRST_NAME"
              printf 'STAGING_TEST_AUTH_LAST_NAME=%s\n' "$STAGING_TEST_AUTH_LAST_NAME"
            fi
            printf 'GOOGLE_CLIENT_ID=%s\n' "$GOOGLE_CLIENT_ID"
            printf 'GOOGLE_CLIENT_SECRET=%s\n' "$GOOGLE_CLIENT_SECRET"

            printf 'S3_ENDPOINT=%s\n' "$S3_ENDPOINT"
            printf 'S3_REGION=%s\n' "$S3_REGION"
            printf 'S3_BUCKET=%s\n' "$S3_BUCKET"
            printf 'S3_ACCESS_KEY_ID=%s\n' "$S3_ACCESS_KEY_ID"
            printf 'S3_SECRET_ACCESS_KEY=%s\n' "$S3_SECRET_ACCESS_KEY"

            printf 'XENDIT_SECRET_KEY=%s\n' "$XENDIT_SECRET_KEY"
            printf 'XENDIT_WEBHOOK_TOKEN=%s\n' "$XENDIT_WEBHOOK_TOKEN"

            printf 'PAYOUT_DESTINATION_ENCRYPTION_KEY=%s\n' "$PAYOUT_DESTINATION_ENCRYPTION_KEY"
            printf 'PAYOUT_DESTINATION_ENCRYPTION_KEY_VERSION=%s\n' "${PAYOUT_DESTINATION_ENCRYPTION_KEY_VERSION:-v1}"
            printf 'PAYMENT_PROVIDER_EVENT_ENCRYPTION_KEY=%s\n' "$PAYMENT_PROVIDER_EVENT_ENCRYPTION_KEY"
            printf 'PAYMENT_PROVIDER_EVENT_ENCRYPTION_KEY_VERSION=%s\n' "${PAYMENT_PROVIDER_EVENT_ENCRYPTION_KEY_VERSION:-v1}"

            printf 'CMS_ORIGIN=%s\n' "$CMS_ORIGIN"

            printf 'TERMS_URL=%s\n' "$TERMS_URL"
            printf 'PRIVACY_URL=%s\n' "$PRIVACY_URL"
            printf 'DATA_USAGE_URL=%s\n' "$DATA_USAGE_URL"
            printf 'CONTACT_US_URL=%s\n' "$CONTACT_US_URL"
          } > "$ENV_FILE"

          if [ "${STAGING_ADMIN_SEED_ENABLED:-false}" = 'true' ]; then
            {
              printf 'ADMIN_EMAIL=%s\n' "$ADMIN_EMAIL"
              printf 'ADMIN_PASSWORD=%s\n' "$ADMIN_PASSWORD"
              printf 'ADMIN_FIRST_NAME=%s\n' "$ADMIN_FIRST_NAME"
              printf 'ADMIN_LAST_NAME=%s\n' "$ADMIN_LAST_NAME"
            } > "$ADMIN_SEED_ENV_FILE"
          fi

      - name: Upload application environment
        shell: bash
        run: |
          set -euo pipefail

          ssh \
            -i "$RUNNER_TEMP/staging_key" \
            -o BatchMode=yes \
            -o StrictHostKeyChecking=yes \
            -o UserKnownHostsFile="$RUNNER_TEMP/staging_known_hosts" \
            deploy@"$STAGING_SERVER" \
            'set -e
             TEMP_FILE=$(mktemp /opt/backend/.env.XXXXXX)
             cat > "$TEMP_FILE"
             chmod 600 "$TEMP_FILE"
             mv "$TEMP_FILE" /opt/backend/.env' \
            < "$RUNNER_TEMP/backend.env"

      - name: Log staging server into GHCR
        shell: bash
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GHCR_USER: ${{ github.actor }}
        run: |
          set -euo pipefail

          printf '%s' "$GHCR_TOKEN" |
            ssh \
              -i "$RUNNER_TEMP/staging_key" \
              -o BatchMode=yes \
              -o StrictHostKeyChecking=yes \
              -o UserKnownHostsFile="$RUNNER_TEMP/staging_known_hosts" \
              deploy@"$STAGING_SERVER" \
              "docker login ghcr.io -u '$GHCR_USER' --password-stdin"

      - name: Deploy API container
        shell: bash
        env:
          IMAGE_TAG: ${{ env.IMAGE_NAME }}:${{ github.event.workflow_run.head_sha }}
        run: |
          set -euo pipefail

          ssh \
            -i "$RUNNER_TEMP/staging_key" \
            -o BatchMode=yes \
            -o StrictHostKeyChecking=yes \
            -o UserKnownHostsFile="$RUNNER_TEMP/staging_known_hosts" \
            deploy@"$STAGING_SERVER" \
            "APP_IMAGE='$IMAGE_TAG' \
             STAGING_DIR=/opt/backend \
             ENV_FILE=/opt/backend/.env \
             BACKUP_DIR=/opt/backend/backups \
             STAGING_NETWORK=kuquest-staging_default \
             POSTGRES_CLIENT_IMAGE='${IMAGE_NAME}:postgres-client-${{ github.event.workflow_run.head_sha }}' \
             bash -s -- deploy" \
            < scripts/staging-operations.sh

      - name: Seed staging Admin account
        shell: bash
        env:
          STAGING_ADMIN_SEED_ENABLED: ${{ secrets.STAGING_ADMIN_SEED_ENABLED }}
          APP_IMAGE: ${{ env.IMAGE_NAME }}:${{ github.event.workflow_run.head_sha }}
        run: |
          set -euo pipefail

          if [ "${STAGING_ADMIN_SEED_ENABLED:-false}" != 'true' ]; then
            echo 'Staging Admin seed is disabled.'
            exit 0
          fi

          SEED_DIR=$(ssh \
            -i "$RUNNER_TEMP/staging_key" \
            -o BatchMode=yes \
            -o StrictHostKeyChecking=yes \
            -o UserKnownHostsFile="$RUNNER_TEMP/staging_known_hosts" \
            deploy@"$STAGING_SERVER" \
            'mktemp -d /opt/backend/admin-seed.XXXXXX')

          if [[ ! "$SEED_DIR" =~ ^/opt/backend/admin-seed\.[A-Za-z0-9]+$ ]]; then
            echo 'Unexpected temporary seed directory returned by staging server.'
            exit 1
          fi

          cleanup_seed_dir() {
            ssh \
              -i "$RUNNER_TEMP/staging_key" \
              -o BatchMode=yes \
              -o StrictHostKeyChecking=yes \
              -o UserKnownHostsFile="$RUNNER_TEMP/staging_known_hosts" \
              deploy@"$STAGING_SERVER" \
              "rm -rf -- '$SEED_DIR'" >/dev/null 2>&1 || true
          }
          trap cleanup_seed_dir EXIT

          tar \
            -C "$GITHUB_WORKSPACE" \
            -cf - \
            package.json \
            tsconfig.json \
            scripts/seed-admin.ts \
            src/config/env.ts \
            src/database \
            src/modules/auth/admin-auth.config.ts \
            src/modules/auth/admin-auth.policy.ts \
            src/modules/auth/auth.config.shared.ts |
            ssh \
              -i "$RUNNER_TEMP/staging_key" \
              -o BatchMode=yes \
              -o StrictHostKeyChecking=yes \
              -o UserKnownHostsFile="$RUNNER_TEMP/staging_known_hosts" \
              deploy@"$STAGING_SERVER" \
              "tar -xf - -C '$SEED_DIR'"

          ssh \
            -i "$RUNNER_TEMP/staging_key" \
            -o BatchMode=yes \
            -o StrictHostKeyChecking=yes \
            -o UserKnownHostsFile="$RUNNER_TEMP/staging_known_hosts" \
            deploy@"$STAGING_SERVER" \
            "cat > '$SEED_DIR/.env.seed' && chmod 600 '$SEED_DIR/.env.seed'" \
            < "$RUNNER_TEMP/admin-seed.env"

          set +e
          ssh \
            -i "$RUNNER_TEMP/staging_key" \
            -o BatchMode=yes \
            -o StrictHostKeyChecking=yes \
            -o UserKnownHostsFile="$RUNNER_TEMP/staging_known_hosts" \
            deploy@"$STAGING_SERVER" \
            "cd /opt/backend && APP_IMAGE='$APP_IMAGE' docker compose run --rm --no-deps --env-from-file '$SEED_DIR/.env.seed' --volume '$SEED_DIR:/app/seed:ro' --workdir /app/seed api bun scripts/seed-admin.ts" \
            > "$RUNNER_TEMP/admin-seed-output.log" 2>&1
          SEED_STATUS=$?
          set -e

          cat "$RUNNER_TEMP/admin-seed-output.log"

          if [ "$SEED_STATUS" -ne 0 ]; then
            if grep -Fq 'An Admin with this email already exists; no changes were made' "$RUNNER_TEMP/admin-seed-output.log"; then
              echo 'Staging Admin already exists; no changes were made.'
            else
              exit "$SEED_STATUS"
            fi
          fi

      - name: Clean temporary secret files
        if: always()
        shell: bash
        run: |
          rm -f \
            "$RUNNER_TEMP/staging_key" \
            "$RUNNER_TEMP/staging_known_hosts" \
            "$RUNNER_TEMP/backend.env" \
            "$RUNNER_TEMP/admin-seed.env" \
            "$RUNNER_TEMP/admin-seed-output.log"
