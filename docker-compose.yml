services:
  postgres:
    image: postgres:17-alpine
    container_name: kuquest-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-kuquest}
      POSTGRES_USER: ${POSTGRES_USER:-kuquest}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-kuquest-local-only}
    ports:
      - "0.0.0.0:${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U ${POSTGRES_USER:-kuquest} -d ${POSTGRES_DB:-kuquest}",
        ]
      interval: 5s
      timeout: 5s
      retries: 5

  postgres-edr:
    image: postgres:17-alpine
    container_name: kuquest-postgres-edr
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${EDR_POSTGRES_DB:-kuquest_edr}
      POSTGRES_USER: ${EDR_POSTGRES_USER:-kuquest}
      POSTGRES_PASSWORD: ${EDR_POSTGRES_PASSWORD:-kuquest-local-only}
    ports:
      - "0.0.0.0:${EDR_POSTGRES_PORT:-6767}:5432"
    volumes:
      - postgres_edr_data:/var/lib/postgresql/data
      - ./docs/db/edr:/edr:ro
      - ./scripts/init-edr-postgres.sh:/docker-entrypoint-initdb.d/00-init-edr.sh:ro
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U ${EDR_POSTGRES_USER:-kuquest} -d ${EDR_POSTGRES_DB:-kuquest_edr}",
        ]
      interval: 5s
      timeout: 5s
      retries: 5

  rustfs:
    image: rustfs/rustfs:latest
    container_name: kuquest-rustfs
    restart: unless-stopped
    environment:
      RUSTFS_ACCESS_KEY: ${S3_ACCESS_KEY_ID:-kuquest}
      RUSTFS_SECRET_KEY: ${S3_SECRET_ACCESS_KEY:-kuquest-local-only}
      RUSTFS_CONSOLE_ENABLE: "true"
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - rustfs_data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/health"]
      interval: 5s
      timeout: 5s
      retries: 5

  rustfs-init:
    image: amazon/aws-cli:latest
    container_name: kuquest-rustfs-init
    depends_on:
      rustfs:
        condition: service_healthy
    entrypoint: ["sh", "-c"]
    command:
      - >
        aws --endpoint-url http://rustfs:9000 s3 mb
        s3://${S3_BUCKET:-kuquest} --region ${S3_REGION:-us-east-1} || true
    environment:
      AWS_ACCESS_KEY_ID: ${S3_ACCESS_KEY_ID:-kuquest}
      AWS_SECRET_ACCESS_KEY: ${S3_SECRET_ACCESS_KEY:-kuquest-local-only}
    restart: "no"

volumes:
  postgres_data:
  postgres_edr_data:
  rustfs_data:
